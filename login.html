<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Darslik Studiyasi — Kirish</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc}
    .login-card{width:min(480px,100%);background:#fff;border:1px solid #dfe3e8;border-radius:9px;
      padding:34px 30px 30px;box-shadow:0 2px 6px rgba(15,23,42,.12)}
    .brand{margin-bottom:26px}
    h1{font-size:25px;line-height:1.2;margin:0 0 4px;font-weight:750}
    .subtitle{color:#64748b;margin:0;font-size:15px}
    label{display:block;font-size:14px;font-weight:650;margin:16px 0 7px}
    input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:8px;padding:0 14px;
      font:inherit;outline:none;background:#eef4ff;color:#111827}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
    button{width:100%;height:46px;margin-top:20px;border:0;border-radius:7px;background:#2563eb;
      color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:hover{background:#1d4ed8}
    button:disabled{opacity:.65;cursor:wait}.status{min-height:22px;margin-top:12px;color:#b42318;font-size:14px}
  </style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <div class="brand"><h1>Darslik Studiyasi</h1><p class="subtitle">Kabinetga kirish</p></div>
    <label for="username">Email yoki login</label><input id="username" autocomplete="username" autofocus required>
    <label for="password">Parol</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="submitButton" type="submit">Kirish</button><div class="status" id="status"></div>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault(); const button=document.getElementById('submitButton'); const status=document.getElementById('status');
      button.disabled=true; status.textContent='';
      try { const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});
        const data=await response.json(); if(!response.ok) throw new Error(data.detail||'Kirish amalga oshmadi.'); location.href='/';
      } catch(error){status.textContent=error.message;button.disabled=false}
    });
  </script>
</body>
</html>
